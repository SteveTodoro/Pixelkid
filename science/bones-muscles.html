const LINE = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="2" stroke-dasharray="4 3"/>`;

// a whole skeleton: skull, spine, ribs, arms, pelvis and legs (joints a little darker)
const SKELETON_BODY = (() => {
  const out = [], fill = [], bone = '#f4f1e6', joint = '#c9c3b0', k = '#1b1b1b';
  const B = (x, y, w, hh, c = bone) => { out.push(R(x - 2, y - 2, w + 4, hh + 4, k)); fill.push(R(x, y, w, hh, c)); };
  B(128, 8, 44, 36); B(134, 44, 32, 10); // skull + jaw
  B(147, 54, 6, 118); // spine
  B(108, 62, 84, 6); // collarbones
  [[74, 64], [86, 64], [98, 58], [110, 50], [122, 40]].forEach(([y, w]) => B(150 - w / 2, y, w, 6)); // ribs
  B(100, 66, 9, 54); B(191, 66, 9, 54); B(98, 120, 13, 6, joint); B(189, 120, 13, 6, joint); // upper arms + elbows
  B(100, 126, 9, 48); B(191, 126, 9, 48); B(96, 174, 16, 12); B(188, 174, 16, 12); // forearms + hands
  B(122, 170, 56, 22); // pelvis
  B(128, 194, 11, 58); B(161, 194, 11, 58); B(126, 252, 15, 7, joint); B(159, 252, 15, 7, joint); // thigh bones + knees
  B(129, 259, 9, 29); B(162, 259, 9, 29); B(120, 288, 18, 8); B(162, 288, 18, 8); // shins + feet
  const holes = R(136, 20, 10, 9, k) + R(154, 20, 10, 9, k) + R(147, 32, 6, 5, k) + R(137, 47, 26, 2, k) + R(132, 176, 12, 10, k) + R(156, 176, 12, 10, k);
  return out.join('') + fill.join('') + R(147, 54, 6, 116, bone) + holes;
})();
const SKELETON = svg('0 0 300 300', SKELETON_BODY);
