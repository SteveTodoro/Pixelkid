const DIGEST_BODY = (ox = 0) => {
  const out = [], fill = [];
  const B = (x, y, w, hh, c) => { out.push(R(x + ox - 2, y - 2, w + 4, hh + 4, '#1b1b1b')); fill.push(R(x + ox, y, w, hh, c)); };
  const skin = '#f2c39b', pipe = '#e57373', big = '#c98a5a', small = '#ffb38a';
  B(70, 4, 60, 52, skin); B(88, 54, 24, 18, skin); B(36, 70, 128, 186, skin);
  const lines = [], tubes = []; // every tube's outline first, then the fills, so the joins are clean
  const P = (x, y, w, hh, c) => { lines.push(R(x + ox - 2, y - 2, w + 4, hh + 4, '#1b1b1b')); tubes.push(R(x + ox, y, w, hh, c)); };
  P(96, 44, 8, 60, pipe);
  P(56, 138, 92, 12, big); P(136, 138, 12, 84, big); P(56, 138, 12, 92, big); P(56, 218, 52, 12, big); P(96, 218, 12, 36, big);
  [154, 168, 182, 196].forEach(y => P(72, y, 58, 8, small));
  P(122, 154, 8, 22, small); P(72, 168, 8, 22, small); P(122, 182, 8, 22, small); P(122, 196, 14, 8, small);
  P(104, 95, 30, 8, '#ff8fb1'); P(96, 100, 46, 30, '#ff8fb1');
  return out.join('') + fill.join('')
    + R(ox + 84, 20, 8, 8, '#1b1b1b') + R(ox + 108, 20, 8, 8, '#1b1b1b') + R(ox + 88, 38, 24, 8, '#9e1c1a')
    + lines.join('') + tubes.join('');
};
