const TXT = 'font-family="Pixelify Sans, monospace" font-weight="700"';
function bar(x, y, l, r, w = 120, ht = 44) {
  const hw = w / 2;
  return `<g ${TXT} font-size="${ht * 0.6}" fill="#fff" text-anchor="middle">
    <rect x="${x}" y="${y}" width="${hw}" height="${ht}" fill="${POLE[l]}" stroke="#000" stroke-width="3"/>
    <rect x="${x + hw}" y="${y}" width="${hw}" height="${ht}" fill="${POLE[r]}" stroke="#000" stroke-width="3"/>
    <rect x="${x + 3}" y="${y + 3}" width="${w - 6}" height="5" fill="#fff" opacity=".35"/>
    <text x="${x + hw / 2}" y="${y + ht * 0.72}" stroke="#000" stroke-width="1">${l}</text>
    <text x="${x + hw * 1.5}" y="${y + ht * 0.72}" stroke="#000" stroke-width="1">${r}</text></g>`;
}
function arrow(x1, y, x2, color = '#1b1b1b') {
  const d = x2 > x1 ? 1 : -1;
  return `<rect x="${Math.min(x1, x2 - d * 14)}" y="${y - 4}" width="${Math.abs(x2 - d * 14 - x1)}" height="8" fill="${color}"/>
    <polygon points="${x2},${y} ${x2 - d * 18},${y - 12} ${x2 - d * 18},${y + 12}" fill="${color}"/>`;
}
const caption = (x, y, t) => `<text x="${x}" y="${y}" ${TXT} font-size="22" fill="#0b6e64" text-anchor="middle">${t}</text>`;
