// The Union Jack, built layer by layer (stage 3 = the full flag)
const FW = 31, FH = 19;
const diag = (x, y) => Math.min(Math.abs(y / (FH - 1) - x / (FW - 1)), Math.abs(y / (FH - 1) - (1 - x / (FW - 1))));
const crossD = (x, y) => Math.min(Math.abs(x - 15), Math.abs(y - 9));
function ukFlag(stage) { // 0 blue cloth · 1 + white X (Scotland) · 2 + red X (St Patrick) · 3 + red cross (England) = Union Jack
  return Pixel.svg(grid(FW, FH, (x, y) => {
    if (stage >= 3 && crossD(x, y) <= 1.5) return 'r';
    if (stage >= 3 && crossD(x, y) <= 3) return 'w';
    if (stage >= 2 && diag(x, y) < 0.04) return 'r';
    if (stage >= 1 && diag(x, y) < 0.09) return 'w';
    return 'b';
  }), { b: '#1f3c88', w: W, r: '#d32f2f' });
}
// Flags to paint in the Flag Studio – small enough to paint square by square
const sDiag = (x, y, w, hh) => Math.min(Math.abs(y / (hh - 1) - x / (w - 1)), Math.abs(y / (hh - 1) - (1 - x / (w - 1))));
const FLAG_COLORS = { r: '#d32f2f', w: W, b: '#1f3c88', g: '#2e9e3e' };
const FLAG_NAMES = { '#d32f2f': 'red', [W]: 'white', '#1f3c88': 'blue', '#2e9e3e': 'green' };

const DRAW_SCOTLAND = grid(15, 9, (x, y) => (sDiag(x, y, 15, 9) < 0.09 ? 'w' : 'b'));
const DRAW_UNION = grid(19, 11, (x, y) => {
  const c = Math.min(Math.abs(x - 9), Math.abs(y - 5));
  if (c === 0) return 'r';
  if (c === 1) return 'w';
  const d = sDiag(x, y, 19, 11);
  return d < 0.035 ? 'r' : d < 0.1 ? 'w' : 'b';

    'kkkkkkkkkk..',

}

function sconeHalf(top, under) {

    under ? '.' + under.repeat(8) + '.' : '..........',

    'yYyyYyyYyy',
