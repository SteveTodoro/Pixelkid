// Flags, built layer by layer (for the Flag Factory)
const FW = 31, FH = 19;
const diag = (x, y) => Math.min(Math.abs(y / (FH - 1) - x / (FW - 1)), Math.abs(y / (FH - 1) - (1 - x / (FW - 1))));
const crossD = (x, y) => Math.min(Math.abs(x - 15), Math.abs(y - 9));
function ukFlag(stage) { // 0 blue cloth · 1 + white X (Scotland) · 2 + red X (St Patrick) · 3 + red cross (England) = Union Jack

    if (stage >= 3 && crossD(x, y) <= 1.5) return 'r';
    if (stage >= 3 && crossD(x, y) <= 3) return 'w';
    if (stage >= 2 && diag(x, y) < 0.04) return 'r';
    if (stage >= 1 && diag(x, y) < 0.09) return 'w';
    return 'b';
  }), { b: '#1f3c88', w: W, r: '#d32f2f' });
}
const FLAG_WHITE = Pixel.svg(grid(FW, FH, () => 'w'), { w: W });
const FLAG_ENGLAND = Pixel.svg(grid(FW, FH, (x, y) => (crossD(x, y) <= 2 ? 'r' : 'w')), { w: W, r: '#d32f2f' });
