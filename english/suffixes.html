<noscript>This lesson needs JavaScript turned on.</noscript>
<script>
// ---------- blocky pictures for this lesson ----------
// a word block with a power-up block snapping onto its END
const TAIL_UP = Pixel.svg([
  'kkkkkkkkkkk.kkkkkkk',
  'kwwwwwwwwwk.kyyyyyk',
  'kwwwwwwwwwk.kyKyyyk',
  'kwkkwkwkwwkkkyKyyyk',
  'kwkwwkkwwwkyyyKyKyk',
  'kwkkwkwkwwk.kyKKyKk',
  'kwwwwwwwwwk.kyyyyyk',
  'kkkkkkkkkkk.kkkkkkk',
], { k: '#1b1b1b', y: '#ffd43b', K: '#85201b', w: '#ffffff' });

// ---------- the lesson ----------
window.LESSON = {
  id: 'english-suffixes',
  subject: 'english',
  title: 'Suffix Squad',
  emoji: '🧩',
  home: '../index.html',
  finishAch: 'speller',
  midBreak: false, // the Suffix Arcade stage is the fun break
  layout: 2, // the compact (one video) version: older saved progress starts again from the top
  mascot: {
    name: 'Quill the Wizard',
    sprite: Pixel.sprites.wizard,
    praise: ['Spell-tastic!', 'Magic!', 'Word wizardry!', 'Critical hit!', 'Abraca-DABRA!', 'Nailed it!', 'Brilliant!'],
    oops: ['Oops! Have another go.', 'Not quite – read it again!', 'Hmm, think again!', 'So close! One more try.'],
  },
  glossary: {
    suffix: { emoji: '🧩', def: 'A few letters you add to the END of a word. Like ful in careful.' },
    'root word': { emoji: '🌱', def: 'The word you start with, before you add anything. The root word of fearless is fear.' },
    adverb: { emoji: '🏃', def: 'A word that tells you HOW something is done, like quickly or sadly.' },
    adjective: { emoji: '🎨', def: 'A describing word, like famous, scary or careful.' },
    poisonous: { emoji: '🍄', def: 'Full of poison. Some mushrooms are poisonous, so never eat wild ones!' },
    information: { emoji: 'ℹ️', def: 'Facts that tell you about something.' },
    famous: { emoji: '⭐', def: 'Known by lots and lots of people.' },
  },
  stages: [
    {
      type: 'welcome', title: 'Suffix Squad', short: 'Start', minutes: 1,
      pic: TAIL_UP,
      hello: "Welcome back to the WORD KINGDOM! Last time we powered up the FRONT of words. Today… we attack from the END!",
      question: 'How can a few letters on the end turn a word like FEAR into FEARLESS?',
      intro: 'Recap, read, watch, pick your own arcade game, hatch a **dragon egg** with your spelling – then stop Grumblegob for good!',
      nameLabel: 'Player name:',
    },

    {
      type: 'review', title: 'Last time…', short: 'Recap', minutes: 2,
      from: { title: 'Prefix Power', emoji: '🦸', url: 'prefixes.html' },
      facts: [
        'A prefix goes on the FRONT of a word and changes its meaning.',
        'un and dis mean not · mis means wrongly · re means again.',
        'sub means under · super means above or more · auto means self.',
        'The Golden Rule: adding a prefix never changes the root word. mis + spell = misspell.',

      questions: [
        { type: 'mcq', q: 'You spelt a word wrongly. You…', options: ['misspelt it', 'respelt it', 'unspelt it'], answer: 0 },
        { type: 'mcq', q: 'What is dis + appear?', options: ['disappear', 'dissappear', 'disapear'], answer: 0, hint: 'Golden Rule: keep all of dis, then all of appear.' },
        { type: 'mcq', q: 'A submarine goes…', options: ['under the sea', 'above the clouds', 'round and round again'], answer: 0 },
        { type: 'tf', q: 'Rewrite means "write it again".', answer: true },
      ],
    },

    {
      type: 'read', title: 'Suffix power-ups', short: 'Read 1', minutes: 4,
      say: 'Read each page carefully – the checks test if you really understood. Tap the yellow words for a 💎.',

            'Prefixes go in front. Suffixes go behind. Both change the [[root word]].',
          ],
          check: { type: 'type', q: 'Stick the suffix ful on the end of colour. Write the new word.', answer: ['colourful', 'colorful'], placeholder: 'colour + ful', hint: 'Keep all of colour, then add ful – with ONE l.', explain: 'colour + ful = colourful 🌈' },
        },
        {
          title: '-ful means "full of"', pic: '🤲💖',
          text: [
            'ful means full of. Someone full of hope is hopeful. A day full of joy is joyful.',
            'Spelling secret: the suffix ful only has ONE l, even though full has two.',
          ],
          check: { q: 'A playful kitten is…', options: ['full of play', 'without any play', 'played again'], answer: 0 },
        },
        {
          title: '-less means "without"', pic: '🙅🦁',
          text: [
            'less means without. A knight with no fear is fearless. A broken pencil with no point is pointless!',
          ],
          check: { type: 'type', q: 'A tree in winter has lost all its leaves. It is WITHOUT leaves. Write the word.', answer: ['leafless'], placeholder: 'leaf + ?', hint: 'Which suffix means WITHOUT?', explain: 'leaf + less = leafless!' },
        },
        {
          title: '-ly tells you HOW', pic: '🐆💨',
          text: [
            'Add ly and you make an [[adverb]] – a word that says how something is done.',

            'If the word ends in a consonant then y, swap the y for i: happy becomes happily, easy becomes easily.',
            'If the word ends in le, swap le for ly: gentle becomes gently, simple becomes simply.',
          ],
          check: { type: 'build', q: 'Use the rules to build angry + ly.', answer: ['angr', 'i', 'ly'], extra: ['y', 'le'], hint: 'Angry ends in a y. Swap it for an i first.', explain: 'angry + ly = angrily – the y swaps for an i!' },
        },
      ],
    },

    {
      type: 'video', title: 'Super Suffixes', short: 'Video', minutes: 6,
      video: { id: 'qX3-0NGWTU8', title: 'Suffixes: ly, ful, less: Super Suffixes they look small, but they are powerful!', channel: 'Learn With Me Mrs. Sullivan', duration: '4:56' },
      say: 'Mrs Sullivan shows how tiny suffixes can be super powerful. Watch, then answer!',
      clues: [
        'What does ly add to the meaning?',
        'What drum word does she make?',
        'What does less mean?',
        'What happens to you in space?',
      ],
      questions: [
        { type: 'mcq', q: 'Mrs Sullivan says ly adds the meaning…', options: ['"in a way that is"', '"full of"', '"without"'], answer: 0 },
        { type: 'type', q: 'She plays the drums in a way that is loud. Finish the sentence.', answer: ['loudly'], before: 'She plays', placeholder: 'loud + ?', hint: 'Which suffix tells you HOW something is done?' },
        { type: 'mcq', q: 'She was full of grace. She was…', options: ['graceful', 'graceless', 'gracely'], answer: 0 },
        { type: 'mcq', q: 'She treated her ice cream cone without care. She was…', options: ['careless', 'careful', 'carely'], answer: 0 },
        { type: 'tf', q: 'In space you are weightless, so you float weightlessly – that word uses two suffixes!', answer: true },
      ],
    },

    {
      type: 'game', title: 'Suffix Lab', short: 'Lab', minutes: 4,
      rounds: [
        {
          game: 'sort', title: 'Suffix chests',
          intro: 'What does the suffix add to each word? Sort them into the right chest.',
          say: 'Full of? Without? Or HOW it is done?',
          buckets: [
            { id: 'ful', label: 'FULL OF', emoji: '🤲' },
            { id: 'less', label: 'WITHOUT', emoji: '🙅' },
            { id: 'ly', label: 'HOW it is done', emoji: '🏃' },
          ],
          items: [
            { label: 'hopeful', bucket: 'ful' }, { label: 'cheerful', bucket: 'ful' }, { label: 'painful', bucket: 'ful' },
            { label: 'homeless', bucket: 'less' }, { label: 'fearless', bucket: 'less' }, { label: 'useless', bucket: 'less' },
            { label: 'quickly', bucket: 'ly' }, { label: 'gently', bucket: 'ly' }, { label: 'happily', bucket: 'ly' }, { label: 'loudly', bucket: 'ly' },
          ],
        },
        {
          game: 'questions', title: 'Word Builder',
          intro: 'Grumblegob chopped up some suffix words! Read the clue, then tap the tiles to **build the word** – use the spelling rules. Some tiles are goblin traps!',
          say: 'Remember the rules: y to i, le to ly, and ful has ONE l.',
          questions: [
            { type: 'build', q: 'Build a word that means "full of hope".', answer: ['hope', 'ful'], extra: ['full', 'less'] },
            { type: 'build', q: 'Build happy + ly.', answer: ['happ', 'i', 'ly'], extra: ['y', 'ful'], hint: 'Swap the y for an i first.' },
            { type: 'build', q: 'Build a word that means "without power".', answer: ['power', 'less'], extra: ['ful', 'ly'] },
            { type: 'build', q: 'Build gentle + ly.', answer: ['gent', 'ly'], extra: ['le', 'e'], hint: 'The le rule: swap le for ly.' },
          ],
        },
      ],
    },

    {
      type: 'read', title: 'Big suffixes: -ous and -ation', short: 'Read 2', minutes: 3,
      say: 'Two bigger, fancier suffixes – and a drop-the-e trap to dodge!',
      cards: [
        {
          title: '-ous makes describing words', pic: '🐍⚠️',
          text: [
            'ous turns a word into an [[adjective]] – a describing word. It means full of or has lots of.',
            'A snake full of poison is [[poisonous]]. A cliff full of danger is dangerous.',
          ],
          check: { q: 'A mountain with lots and lots of mountains around it is…', options: ['mountainous', 'mountainful', 'mountainly'], answer: 0, hint: 'Which suffix makes a fancy describing word?' },
        },
        {
          title: 'Drop the e!', pic: '⭐ e➡️🗑️',
          text: [
            'If the root word ends in e, drop the e before you add ous.',
            'fame becomes [[famous]]. No e left in the middle!',
          ],
          check: { type: 'type', q: 'Add ous to fame. Write the new word.', answer: ['famous'], placeholder: 'fame + ous', hint: 'Fame ends in e – drop the e first!', explain: 'fame + ous = famous. No e left in the middle!' },
        },
        {
          title: '-ation makes "thing" words', pic: '📚ℹ️',
          text: [
            'ation turns a doing word into a thing. When you inform someone, you give them [[information]].',
            'When you prepare for a party, the getting-ready is the preparation. The e of prepare gets dropped again!',
          ],
          check: { q: 'You invite your friends to your party. The card you send them is an…', options: ['invitation', 'inviteous', 'invitely'], answer: 0, hint: 'You need a THING word, and the e drops off.' },
        },
      ],
    },

    {
      type: 'game', title: 'Suffix Arcade: pick a game!', short: 'Arcade', icon: '🕹️', minutes: 4,
      pick: { title: '🕹️ Pick your Suffix Arcade game!', say: 'Your choice! Which game do you want to play? Win one to carry on – or play them all!' },
      rounds: [
        {
          game: 'invaders', title: 'Spelling Blaster', emoji: '🚀', blurb: 'Shoot the goblin aliens with the RIGHT spellings.',
          intro: 'Goblin aliens are invading with spelling mistakes! Read each mission at the top – then shoot ONLY the correct spellings.',
          say: 'Tap above an alien to fly there and fire! Think about the rule first.',
          waves: [
            {
              prompt: 'Shoot the CORRECT ful words!',
              items: [
                { label: 'careful', ok: true }, { label: 'helpful', ok: true }, { label: 'joyful', ok: true },
                { label: 'carefull', ok: false, why: 'The suffix ful has only ONE l: careful.' },
                { label: 'helpfull', ok: false, why: 'One l in ful: helpful.' },
                { label: 'joyfull', ok: false, why: 'One l in ful: joyful.' },
              ],
            },
            {
              prompt: 'y turns into i! Shoot the correct spellings.',
              items: [
                { label: 'happily', ok: true }, { label: 'easily', ok: true }, { label: 'busily', ok: true },
                { label: 'happyly', ok: false, why: 'Swap the y for i: happily.' },
                { label: 'easyly', ok: false, why: 'Swap the y for i: easily.' },
                { label: 'busyly', ok: false, why: 'Swap the y for i: busily.' },
              ],
            },
            {
              prompt: 'Drop the e! Shoot the correct spellings.',
              items: [
                { label: 'famous', ok: true }, { label: 'nervous', ok: true }, { label: 'preparation', ok: true },
                { label: 'fameous', ok: false, why: 'Drop the e before ous: famous.' },
                { label: 'nerveous', ok: false, why: 'Drop the e before ous: nervous.' },
                { label: 'prepareation', ok: false, why: 'Drop the e before ation: preparation.' },
              ],
            },
          ],
          done: 'SPELLING BLASTER CLEAR! Grumblegob\'s goblins are running away!',
        },
        {
          game: 'steadyhand', title: 'Steady Hand', emoji: '✏️', blurb: 'Guide your pencil along the wiggly path – don\'t touch the sides!',
          intro: 'Press on the green dot and follow the wiggly path all the way to the 🏁 – carefully! Pick Easy, Medium or Hard.',
          say: 'Steady hands! Don\'t touch the sides!',
          done: 'What a steady hand! Grumblegob could never do that.',
        },
        {
          game: 'mystery', title: 'Mystery Words', emoji: '🔍', blurb: 'Crack the clues to find the hidden word.',
          intro: 'Grumblegob has hidden some **suffix words**! Read the clue and work out the word. Solve it on the first clue for 3 gems!',
          say: 'The fewer clues you need, the more gems you win – and spell it right!',
          words: [
            { word: 'fearless', clues: ['It describes a person.', 'A brave knight is like this.', 'It means WITHOUT any fear.'] },
            { word: 'poisonous', clues: ['It is a describing word with a big suffix.', 'Some snakes and berries are like this.', 'It means full of poison.'] },
            { word: 'information', clues: ['It is a thing, not a doing word.', 'You find lots of it in books and on websites.', 'When you inform someone, you give them this.'] },
          ],
          done: 'MYSTERY SOLVED! Grumblegob can\'t hide anything from you!',
        },
      ],
    },

    {
      type: 'game', title: 'The Spell Test: Dragon Egg Hatchery', short: 'Spell test', icon: '🪄', kind: 'Spelling test', minutes: 6,
      rounds: [
        {
          game: 'spelltest', mode: 'fix', title: 'Goblin Graffiti', scene: 'egg', prize: 'the goblin-proof egg',
          intro: 'Grumblegob has scribbled spelling mistakes all over the castle walls! Write each red word correctly to crack open a dragon egg.',
          say: 'Uh-oh, a spelling goblin got here! Write the red word correctly.',
          words: [
            { word: 'careful', wrong: 'carefull', sentence: 'Be ___ when you carry the hot soup.', hint: 'ful has only ONE l.' },
            { word: 'happily', wrong: 'happyly', sentence: 'The dragon flapped its wings ___.', hint: 'Swap the y for an i, then add ly.' },
            { word: 'famous', wrong: 'fameous', sentence: 'One day I will be a ___ footballer.', hint: 'Drop the e before ous.' },
          ],
        },
        {
          game: 'spelltest', mode: 'listen', title: 'The Real Spell Test', scene: 'egg', prize: 'Sparky the dragon',
          intro: 'The real test! Press 🔊 to hear each word in a sentence, then spell it. Every word cracks the egg a little more…',
          say: 'Listen carefully… then type the word!',
          words: [
            { word: 'hopeful', sentence: 'I am ___ that it will snow tomorrow.', clue: 'full of hope', hint: 'hope + ful – one l!' },
            { word: 'fearless', sentence: 'The ___ knight walked into the dragon’s cave.', clue: 'without fear', hint: 'fear + less' },
            { word: 'quickly', sentence: 'The mouse ran ___ into its hole.', clue: 'fast', hint: 'quick + ly. Quick ends in ck.' },
            { word: 'easily', sentence: 'You beat that level ___!', clue: 'with no trouble', hint: 'easy ends in y – swap it for i.' },
            { word: 'simply', sentence: 'The answer is ___ too hard for a goblin.', clue: 'just, or in a simple way', hint: 'simple ends in le – swap le for ly.' },
            { word: 'dangerous', sentence: 'Crossing a busy road without looking is ___.', clue: 'full of danger', hint: 'danger + ous' },
            { word: 'information', sentence: 'The museum sign gave us lots of ___.', clue: 'facts about something', hint: 'inform + ation' },
          ],
        },
        {
          game: 'invaders', title: 'Letter Blaster',
          intro: 'Bonus arcade round! Read the clue at the top, then **shoot the letters in order** to spell the word. Press 🔊 to hear it.',
          say: 'Shoot the letters IN ORDER!',
          waves: [
            { spell: 'useful', clue: 'Full of use', decoys: 'ao' },
            { spell: 'gently', clue: 'In a gentle way', decoys: 'ai' },
          ],
          done: 'LETTER BLASTER CLEAR! You are a suffix superstar!',
        },
      ],
    },

    {
      type: 'quiz', title: "Boss Battle: Grumblegob's Revenge", short: 'Boss', kind: 'Boss battle', minutes: 5,
      say: 'GRUMBLEGOB is back – and now he is chopping the ends off words! Every right answer is a hit. Finish him, {name}!',
      boss: { name: 'Grumblegob', sprite: Pixel.sprites.goblin, attack: '🪨', lines: { intro: 'Grumblegob is back! And I\'m even grumpier-ER!', hurt: ['Ow! That was pain-FUL!', 'Grumble grumble!', 'Argh! Too clever!'], taunt: ['Hehehe! Wrong!', 'Grumble-WIN!', 'Missed me!'], angry: 'Now I\'m angri-EST!', defeat: 'NOOO! Grumblegob is help-LESS!', win: 'Hehehe! Grumblegob wins again! Go back and practise!', stunned: 'Ooh… I\'m all dizzy-FUL…', beg: ['Wait! Be kind-LY!', 'I\'m feeling help-LESS!', 'Mercy-FUL, please!'] } },
      questions: [
        { type: 'mcq', q: 'A cup with no handle is…', options: ['handleless', 'handleful', 'handlely'], answer: 0 },
        { type: 'gap', q: 'The baby was sleeping, so we whispered ___.', options: ['quietly', 'quietful', 'quietless'], answer: 0 },
        { type: 'mcq', q: 'Grumblegob wrote "wonderfull". Which is right?', options: ['wonderful', 'wonderfull', 'wundaful'], answer: 0, hint: 'How many l letters does the suffix ful have?' },
        { type: 'type', q: 'Write busy + ly.', answer: ['busily'], placeholder: 'busy + ly', hint: 'busy ends in a y… swap it for an i!' },
        { type: 'build', q: 'Build terrible + ly.', answer: ['terrib', 'ly'], extra: ['le', 'e'], hint: 'The le rule: swap le for ly!' },
        { type: 'tf', q: 'In "The cat purred softly", the word softly tells us HOW the cat purred.', answer: true },
        { type: 'mcq', q: 'Which word describes a jungle that is full of mystery?', options: ['mysterious', 'mysteryful', 'mysteryly'], answer: 0, explain: 'mystery + ous – the y turns into an i, just like happy → happily!' },
        { type: 'mcq', q: 'Which word is spelt correctly?', options: ['nervous', 'nervus', 'nerveous'], answer: 0, hint: 'Drop the e from nerve, then add ous.' },
        { type: 'gap', q: 'Our teacher gave us lots of useful ___ about volcanoes.', options: ['information', 'informous', 'informly'], answer: 0 },
        { type: 'order', q: 'Watch "happy" turn into "happily"! Put the word changes in order.', items: ['😊 happy', '✂️ happ (the y comes off)', '🔤 happi (an i goes on)', '✨ happily (add ly)'], ends: ['START', 'NEW WORD'], hint: 'Start with the whole word happy.' },
      ],
    },
  ],
};
</script>
