<noscript>This lesson needs JavaScript turned on.</noscript>
<script>
// ---------- clock pictures for this lesson ----------
const C = (t, o) => Clock.svg(t, o);                                   // a plain clock
const H = t => Clock.svg(t, { halves: true, ring: 'pastto' });         // with the PAST / TO helper
// tap zones over the 12 numbers of a plain clock C(…), for hotspot questions (index 0 = the 12, 3 = the 3 …)
const CLOCK_SPOTS = Array.from({ length: 12 }, (_, i) => ({ x: 50 + 34 * Math.sin(i * Math.PI / 6), y: 50 - 34 * Math.cos(i * Math.PI / 6), r: 8, label: `the ${i || 12}` }));

// the boss: Count Clockula, who wants to muddle up every clock in the land
const CLOCKULA = Pixel.svg([
  'k..kkkkkk..k',
  'kkkkkkkkkkkk',
  '.kssssssssk.',
  '.ksrsssrssk.',
  '.kssssssssk.',
  '.ksswsswssk.',
  '..kssssssk..',
  'pkkkyyyykkkp',
  'ppkywwwwykpp',
  'ppkywkwwykpp',
  'ppkywwkwykpp',
  'ppkkyyyykkpp',
  'p.kkkkkkkk.p',
  '..kk....kk..',
], { k: '#1b1b1b', s: '#dfe7f2', r: '#e53935', w: '#ffffff', y: '#ffd43b', p: '#7b1fa2' });

// ---------- the lesson ----------
window.LESSON = {
  id: 'maths-time',
  subject: 'maths',
  title: 'Tick Tock Time',
  emoji: '⏰',
  home: '../index.html',

  },

      nameLabel: 'Player name:',

    {
      type: 'review', title: 'Clock warm-up', short: 'Warm-up', minutes: 3,
      say: "Let's warm up with clock skills you already know. Read the notes, then test your memory!",

                { label: 'half past 2', ok: false, why: 'Half past 2 is 2:30.' },

            },
            {
              prompt: 'Shoot: 11:45',

      say: 'Now the long hand can point at ANY number. Read carefully – it is all about counting in 5s!',
      cards: [

            'So when the long hand points at the 1, five minutes have gone. At the 2, ten minutes. Count in 5s: 5, 10, 15, 20, 25, 30!',
          ],
          check: { type: 'type', q: 'The long hand is pointing at the 4. How many minutes past the hour is that?', answer: ['20', 'twenty'], after: 'minutes past', placeholder: 'Count in 5s', hint: 'Count in 5s from the 12: 5, 10, 15…', explain: '5, 10, 15, 20 – it is 20 minutes past.' },
        },
        {
          title: 'Minutes past', pic: H('9:10'),
          text: [
            'On the right side we say how many minutes PAST. Say the minutes first, then the hour.',
            'The long hand is on the 2 – that is 10 minutes. The short hand has just passed the 9. So this is 10 past 9.',

          check: { q: 'The long hand is on the 5. The short hand has just gone past the 1. What time is it?', options: ['25 past 1', '5 past 1', '25 to 1'], answer: 0, hint: 'Count in 5s up to the 5. Which side is it on?' },
        },
        {
          title: 'Minutes to', pic: H('6:40'),

          check: { q: 'The long hand is on the 10. The short hand is nearly at the 4. What time is it?', options: ['10 to 4', '10 past 4', '10 to 3'], answer: 0 },

          check: { type: 'type', q: 'A microwave shows 7:55. Write it in clock words.', answer: ['5 to 8', 'five to eight', '5 to eight', 'five to 8'], placeholder: 'like: 10 past 3', hint: '55 minutes past 7… how many minutes until 8 o\'clock?', explain: 'Only 5 minutes until 8 o\'clock, so it is 5 to 8.' },

      clues: [
        'Why is the hour hand shorter?',
        'How many minutes is the 1 really worth?',
        'What does the 11 mean on the TO side?',
        'What do the big numbers stand for?',
      ],
      questions: [
        { type: 'mcq', q: 'Mrs Roberts says the hour hand is shorter because…', options: ['it only needs to point at the big hour numbers', 'it is lazy', 'it is the newest hand'], answer: 0 },

        { type: 'type', q: 'When the long hand points at the 2, how many minutes past is it?', answer: ['10', 'ten'], after: 'minutes past', placeholder: 'Count in 5s', hint: 'Count in 5s: the 1 is 5, the 2 is…' },
        { type: 'mcq', q: 'On the TO side, the long hand on the 11 means…', options: ['5 minutes to the next hour', '11 minutes past', '55 minutes to'], answer: 0 },
        { type: 'mcq', q: 'For the TO side, Mrs Roberts asks you to think about…', options: ['how far the minute hand has to go to get back to the 12', 'how far the hour hand has gone', 'what number is at the bottom'], answer: 0 },
        { type: 'tf', q: 'The big numbers on the clock stand for hours, AND for lots of 5 minutes.', answer: true },

          helper: 'off', start: '12:00',
          times: ['9:10', '1:25', '6:40', '3:50', '10:35', '7:55'],
        },
        {
          game: 'match', title: 'Clock pairs', html: true,
          intro: 'Match each clock to its time in words.',
          say: 'Tap a clock, then tap its time!',

        { type: 'mcq', q: 'Which clock shows half past 11?', optionsHtml: true, options: [C('11:30'), C('12:30'), C('11:00')], answer: 0, hint: 'Half past: long hand on the 6, short hand just past the 11.' },
