<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../shared/lesson.css">

<body>
<noscript>This lesson needs JavaScript turned on.</noscript>
<script>
// ---------- clock pictures for this lesson ----------
const C = (t, o) => Clock.svg(t, o);                                   // a plain clock
const H = t => Clock.svg(t, { halves: true, ring: 'pastto' });         // with the PAST / TO helper
const M = t => Clock.svg(t, { ring: 'minutes' });                      // with the 5–55 minute numbers
// tap zones over the 12 numbers of a plain clock C(…), for hotspot questions (index 0 = the 12, 3 = the 3 …)
const CLOCK_SPOTS = Array.from({ length: 12 }, (_, i) => ({ x: 50 + 34 * Math.sin(i * Math.PI / 6), y: 50 - 34 * Math.cos(i * Math.PI / 6), r: 8, label: `the ${i || 12}` }));

// the boss: Count Clockula, who wants to muddle up every clock in the land
const CLOCKULA = Pixel.svg([
  'k..kkkkkk..k',
  'kkkkkkkkkkkk',
  '.kssssssssk.',
  '.ksrsssrssk.',
  '.kssssssssk.',
  '.ksswsswssk.',
  '..kssssssk..',
  'pkkkyyyykkkp',
  'ppkywwwwykpp',
  'ppkywkwwykpp',
  'ppkywwkwykpp',
  'ppkkyyyykkpp',
  'p.kkkkkkkk.p',
  '..kk....kk..',
], { k: '#1b1b1b', s: '#dfe7f2', r: '#e53935', w: '#ffffff', y: '#ffd43b', p: '#7b1fa2' });

// ---------- the lesson ----------
window.LESSON = {
  id: 'maths-time',
  subject: 'maths',
  title: 'Tick Tock Time',
  emoji: '⏰',
  home: '../index.html',

    oops: ['Oops! Have another go.', 'Not quite – look at both hands!', 'Hmm, think again!', 'So close! One more try.'],

    clockwise: { emoji: '🔃', def: 'The way the hands of a clock go round: from 12 to 1 to 2 to 3…' },

        { type: 'mcq', q: 'Which hand tells you the HOUR?', options: ['the short hand', 'the long hand', 'both hands together'], answer: 0 },

      ],
    },

            'The long [[minute hand]] goes all the way round in 60 minutes. That is one hour.',

            'Long hand on the 3 = quarter past. A [[quarter]] of an hour is 15 minutes.',
            'The short hand has just passed the 2. So it is quarter past 2.',

          title: 'Quarter to: say the NEXT hour', pic: H('3:45'),

          check: { q: 'Long hand on the 9. Short hand nearly at the 6. Tock says "quarter to 5". What is right?', options: ['quarter to 6', 'quarter past 5', 'quarter to 5'], answer: 0, hint: 'Which number is the short hand heading TO?' },
        },
      ],
    },

      say: 'This video is all about quarter to. Watch, then answer!',

          times: ['4:00', '7:30', '2:15', '5:45', '9:15', '6:30', '11:45', '1:45'],
        },
        {
          game: 'questions', title: 'Name that clock',
          intro: 'Quick fire! Look at the long hand first, then the short hand.',
          say: 'Long hand first! Then the short hand.',
          questions: [
            { type: 'mcq', q: 'What time is it?', pic: C('6:15'), options: ['quarter past 6', 'quarter to 6', 'quarter past 3'], answer: 0, hint: 'Long hand on the 3 = quarter past.' },
            { type: 'mcq', q: 'What time is it?', pic: C('9:30'), options: ['half past 9', 'half past 6', 'quarter to 9'], answer: 0, hint: 'Long hand on the 6 = half past. Which number has the short hand just passed?' },

            { type: 'mcq', q: 'Which clock shows quarter to 3?', optionsHtml: true, options: [C('2:45'), C('3:45'), C('3:15')], answer: 0, hint: "Quarter to 3 comes BEFORE 3 o'clock. The short hand is nearly at the 3." },
            { type: 'type', q: 'Write this time in words.', pic: C('4:15'), answer: ['quarter past 4', 'quarter past four', 'a quarter past 4', 'a quarter past four'], placeholder: 'like: half past 2', hint: 'Long hand on the 3 = quarter past.', explain: 'Quarter past 4!' },
            { type: 'mcq', q: 'What time is it?', pic: C('1:45'), options: ['quarter to 2', 'quarter to 1', 'quarter past 9'], answer: 0, hint: 'Long hand on the 9 = quarter to. Say the NEXT hour.' },
          ],
        },
      ],
    },

    {
      type: 'read', title: 'Five-minute jumps', short: 'Read 2', minutes: 5,
      say: 'Now the long hand can point at ANY number. Count in 5s!',
      cards: [
        {
          title: 'Secret minute numbers', pic: M('12:00'),
          text: [
            'For the long hand, every number has a secret minute number. Count in 5s to find it!',
            'The 1 means 5 minutes. The 2 means 10. The 3 means 15. Then 20, 25, 30…',
          ],
          check: { type: 'type', q: 'The long hand points at the 4. How many minutes past is that?', answer: ['20', 'twenty'], after: 'minutes past', placeholder: 'Count in 5s', hint: 'Count in 5s from the 12: 5, 10, 15…', explain: '5, 10, 15, 20 – it is 20 minutes past.' },
        },
        {
          title: 'Minutes past', pic: H('9:10'),
          text: [
            'Right side = PAST. Say the minutes, then the hour.',
            'Long hand on the 2 = 10 minutes. Short hand just past the 9. So it is 10 past 9.',
          ],
          check: { q: 'Long hand on the 5. Short hand just past the 1. What time is it?', options: ['25 past 1', '5 past 1', '25 past 5'], answer: 0, hint: 'Count in 5s up to the 5. Which number has the short hand passed?' },
        },
        {
          title: 'Minutes to', pic: H('6:40'),
          text: [
            'Left side = TO. Count back from the 12: the 11 is 5 to, the 10 is 10 to, the 8 is 20 to.',
            'Long hand on the 8, short hand nearly at the 7. So it is 20 to 7.',
          ],
          check: { q: 'Long hand on the 10. Short hand nearly at the 4. What time is it?', options: ['10 to 4', '10 past 4', '10 to 3'], answer: 0, hint: 'Left side, so TO. Which hour is coming?' },
        },
        {
          title: 'Digital clocks count on', pic: '📱 4:50',
          text: [
            'A [[digital]] clock never says TO. 4:50 means 50 minutes past 4.',
            "On an [[analogue]] clock that is 10 minutes before 5 o'clock. So it is 10 to 5!",
          ],
          check: { type: 'type', q: 'A microwave shows 7:55. Write it in clock words.', answer: ['5 to 8', 'five to eight', '5 to eight', 'five to 8'], placeholder: 'like: 10 past 3', hint: "How many minutes until 8 o'clock?", explain: "Only 5 minutes until 8 o'clock, so it is 5 to 8." },
        },
      ],
    },

    {
      type: 'game', title: 'Clock Challenge', short: 'Clocks', minutes: 6,
      rounds: [
        {
          game: 'clock', mode: 'read', title: 'Count in 5s', ring: 'minutes',
          intro: 'Tap the hour, then type the minutes. The brown numbers round the outside show the secret minutes!',
          say: 'The 2 means 10. Count in 5s!',
          times: ['9:10', '1:25', '4:20', '6:40', '3:50', '7:05'],
        },
        {
          game: 'clock', mode: 'set', title: 'Five-minute clocks',
          intro: 'Set each clock. The helper is OFF – tap 💡 Helper if you need it.',
          say: 'Count in 5s! Right side PAST, left side TO.',
          helper: 'off', start: '12:00',
          times: ['9:10', '1:25', '6:40', '3:50', '10:35', '7:55'],
        },
      ],
    },

    {
      type: 'game', title: 'Clock Arcade: pick a game!', short: 'Arcade', icon: '🕹️', minutes: 4,
      pick: { title: '🕹️ Pick your arcade game!', say: 'Your choice! Which game do you want to play? Win one to carry on – or play them all!' },
      rounds: [
        {
          game: 'invaders', title: 'Quarter Blaster', emoji: '🚀', blurb: 'Shoot the alien with the same time in words.',
          intro: 'Arcade time! Read the digital time at the top, then **shoot the alien** with the same time in words. Watch out for the tricky hour!',
          say: '◀ ▶ to move, tap FIRE to shoot. Check the hour!',
          waves: [
            {
              prompt: 'Shoot: 2:45',
              items: [
                { label: 'quarter to 3', ok: true },
                { label: 'quarter to 2', ok: false, why: '2:45 is heading TO 3 o\'clock, so it is quarter to 3.' },
                { label: 'quarter past 2', ok: false, why: 'Quarter past 2 is 2:15.' },
                { label: 'half past 2', ok: false, why: 'Half past 2 is 2:30.' },
              ],
            },
            {
              prompt: 'Shoot: 8:15',
              items: [
                { label: 'quarter past 8', ok: true },
                { label: 'quarter to 8', ok: false, why: 'Quarter to 8 is 7:45.' },
                { label: 'quarter past 9', ok: false, why: 'The hour is 8, not 9.' },
                { label: "8 o'clock", ok: false, why: "8 o'clock is 8:00." },
              ],
            },
            {
              prompt: 'Shoot: 11:45',

                { label: 'half past 11', ok: false, why: 'Half past 11 is 11:30.' },
              ],
            },
          ],
          done: 'QUARTER BLASTER CLEAR! Clockula is getting nervous…',
        },
        {
          game: 'steadyhand', title: 'Steady Hand', emoji: '✏️', blurb: 'Guide your pencil along the wiggly path – don\'t touch the sides!',
          intro: 'Press on the green dot and follow the wiggly path all the way to the 🏁 – carefully! Pick Easy, Medium or Hard.',
          say: 'Steady hands! Don\'t touch the sides!',
          done: 'What a steady hand! Steadier than a minute hand.',
        },
        {
          game: 'mystery', title: 'Mystery Clock Words', emoji: '🔍', blurb: 'Crack the clues to find the clock word.',
          intro: 'Tock has hidden some **clock words**! Read the clue and work out the word. Solve it on the first clue for 3 gems!',
          say: 'The fewer clues you need, the more gems you win!',
          words: [
            { word: 'quarter', clues: ['It is a part of an hour.', 'There are 4 of them in one hour.', 'It is 15 minutes long.'] },
            { word: 'digital', clues: ['It is a kind of clock.', 'It has no hands at all.', 'It shows the time only in numbers, like 4:50.'] },
            { word: 'clockwise', clues: ['It is a direction.', 'Tighten a jar lid and you turn it this way.', 'It is the way the hands go round a clock.'], options: ['clockwise', 'backwards', 'upside down', 'sideways'] },
          ],
        },
      ],

    {
      type: 'quiz', title: 'Boss Battle: Count Clockula', short: 'Boss', kind: 'Boss battle', minutes: 7,

      boss: {
        name: 'Count Clockula', sprite: CLOCKULA, attack: '⏰',
        lines: {
          intro: 'Mwah-ha-ha! I am COUNT CLOCKULA! I vill muddle every clock – you vill never know vhat time it is!',
          hurt: ['Ow! Right on time!', 'Tick-tock… OUCH!', 'Blah! Too clever!', 'My clocks!'],
          taunt: ['Mwah-ha-ha! Wrong time!', 'Your clock is MUDDLED!', 'Tick-tock, wrong o\'clock!', 'Hee hee! Quarter to WHAT?'],

          miss: 'Vhat?! Not one alarm clock hit you?!',

          stunned: 'Ooh… my head is going… anti-clockvise…',
          beg: ['Vait! Is it too late to say sorry?', 'Mercy! I vill fix every clock!', 'Just give me a quarter of an hour!'],
