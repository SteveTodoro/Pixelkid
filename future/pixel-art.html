    'pixel art': { emoji: '👾', def: 'Pictures made on purpose from big, chunky pixels – one square at a time.' },

        },
        {
          title: 'Millions of them!', pic: '📱🔍',

            'A tablet screen has **millions** of pixels. They are so tiny and packed so close together that you cannot see them one by one.',

          check: { q: "Why can't you see the pixels on a tablet?", options: ['They are tiny and there are millions of them', 'They are invisible ink', 'They switch off when you look'], answer: 0 },
        },
        {
          title: 'Blocky old games', pic: '👾🕹️',

          check: { q: 'Why did old games look blocky?', options: ['They could only use a few pixels', 'Players liked squares', 'The TVs were broken'], answer: 0 },

          title: 'Choosing colours', pic: '🎨',

          ],
          check: { q: 'A palette is…', options: ['the set of colours you choose', 'a type of brush', 'a robot'], answer: 0 },
        },
      ],
    },

    {
      type: 'video', title: 'Coding with QMO: Pixel', short: 'Video 1', minutes: 4,
      video: { id: 'R65_SYq24Rg', title: 'Coding With QMO – Episode 8 | PIXEL', channel: 'Cozmo & Friends', duration: '2:51' },
      say: 'A short cartoon about pixels! Watch, then answer my questions.',
      clues: [
        'What is pixel short for?',
        'What does a pixel look like?',
        "Why did the portrait look blocky?",
        'How many pixels do computers use?',
      ],
      questions: [
        { type: 'mcq', q: 'Pixel is short for…', options: ['picture element', 'pick some yellow', 'pizza slice'], answer: 0 },
        { type: 'mcq', q: 'In the video, a pixel is a…', options: ['small square of colour', 'tiny robot', 'kind of sweet'], answer: 0 },
        { type: 'tf', q: 'One pixel on its own makes a big, detailed picture.', answer: false, explain: 'One pixel is just one square. LOTS of pixels together make a picture.' },
        { type: 'mcq', q: 'Why did the pixel portrait look blocky?', options: ['There were only a few pixels to use', 'The paint was wet', 'The computer was sleepy'], answer: 0 },
        { type: 'mcq', q: 'Real computer pictures use…', options: ['thousands of pixels', 'just one pixel', 'no pixels at all'], answer: 0 },
      ],
    },

      type: 'game', title: 'Copy the Pixels', short: 'Game 1', minutes: 6,
      rounds: [
        Object.assign({
          game: 'pixelcopy', title: 'Pixel heart',
          intro: 'Copy the heart! Pick a colour, then tap or drag on the grid.',
          say: 'Pro trick: draw the black outline first, then use 🪣 Fill to colour the inside in one tap!',
          tips: ['Draw the **black outline** first.', 'Then pick red and use **🪣 Fill** inside the heart.', 'Add one **white** pixel to make it shiny.', 'Made a mistake? Use **↶ Undo** or the **🧽 Eraser**.'],
          done: 'PERFECT HEART! You used an outline and a highlight, just like a pro!',
        }, HEART),
        Object.assign({
          game: 'pixelcopy', title: 'Spooky ghost',
          intro: 'Copy the ghost. See the **grey** pixels? That is **shading** – the shadow side of the ghost.',
          say: 'Shading makes things look round. The grey goes on the shadow side!',
          tips: ['Outline first, then fill with white.', 'Add the **grey shading** on the right side.', 'Use **🔍 Show mistakes** if you get stuck.'],
          done: 'BOO-tiful! That shading makes your ghost look round!',
        }, GHOST),
      ],
    },

    {
      type: 'read', title: 'Design like a pro', short: 'Read 2', minutes: 4,
      say: 'Time to learn the tricks real game artists use!',
      cards: [
        {
          title: 'Big shapes first', pic: '⬛➡️🟥',
          text: [
            'Pixel artists usually start with an [[outline]] – a dark line around the edges of the shape.',
            'Then they fill in the big areas of colour. Details come last.',
          ],
          check: { q: 'What do pixel artists often draw first?', options: ['the outline', 'the tiny details', 'the background clouds'], answer: 0 },
        },
        {
          title: 'Light and shadow', pic: Pixel.svg(GHOST.target, GHOST.colors),
          text: [
            '[[Shading|shading]] means using a **darker** colour on the side in shadow. It makes things look round and solid.',

          ],
          check: { q: 'To make an apple look shiny, you add…', options: ['a white highlight pixel', 'more black', 'nothing at all'], answer: 0 },
        },
        {
          title: 'Mirror, mirror', pic: Pixel.svg(ALIEN.target, ALIEN.colors),
          text: [
            'Lots of characters are [[symmetrical]] – the same on both sides, like this alien.',
            'Designers draw one half, then **mirror** it to make the other half. It saves loads of time!',
          ],
          check: { q: 'A symmetrical picture is…', options: ['the same on both sides', 'all one colour', 'upside down'], answer: 0 },
        },
        {
          title: 'Fewer colours, better art', pic: '🟩🟦🟨',
          text: [
            'Using too many colours can make a picture messy. Pros pick a small [[palette]] – often just 4 to 6 colours.',
            'A light and a dark version of the same colour is great for shading.',
          ],
          check: { q: 'Using fewer colours makes pixel art look…', options: ['neat and matching', 'messy', 'invisible'], answer: 0 },
        },
        {
          title: 'Try, check, improve', pic: '↶✏️✅',
          text: [
            'Real designers try an idea, step back to look at it, then fix what is not quite right.',
            'Making mistakes is part of being an artist – that is what **Undo** is for!',
          ],
          check: { q: "Your drawing doesn't look right. What do designers do?", options: ['Undo and try again', 'Give up forever'], answer: 0 },

      say: 'Watch how real artists make pixel art step by step. Look for the tricks you just learned!',
      clues: [
        'Which colour do they start with?',
        'Which design trick means they repeat the same steps on both sides?',
        'How do they make the ice cream look shiny?',
        'What do they sprinkle on top?',

      questions: [
        { type: 'mcq', q: 'What did they draw in pixel art?', options: ['🍦 an ice cream cone', '🐱 a cat', '🚀 a rocket'], answer: 0 },
        { type: 'mcq', q: 'Which colour did they start drawing with?', options: ['black', 'pink', 'yellow'], answer: 0, hint: 'They drew the outline first…' },
        { type: 'tf', q: 'The ice cream cone was symmetrical, so they repeated the same steps on both sides.', answer: true },
        { type: 'mcq', q: 'How did they make the ice cream look shiny?', options: ['They left some pixels white as a highlight', 'They used glitter', 'They coloured it all black'], answer: 0 },
        { type: 'mcq', q: 'What did they add on top of the pink ice cream?', options: ['sprinkles', 'a cherry', 'chocolate sauce'], answer: 0 },

      ],
    },

      type: 'game', title: 'Symmetry Challenge', short: 'Game 2', minutes: 5,

        {
          game: 'wordsearch', title: 'Word Hunt',

          say: 'Hunt for the hidden words! Drag across a word – or tap the first letter, then the last.',

          words: ['PIXEL', 'GRID', 'PALETTE', 'OUTLINE', 'SHADING', 'MIRROR', 'SCREEN', 'DESIGN'],

    {
      type: 'break', title: 'Brain Break', short: 'Break', minutes: 2,
      say: 'Rest your eyes and stretch your drawing hand!',
      wiggle: {
        title: '🕺 Pixel Moves!',
        seconds: 60,
        moves: [
          '🟥 Be a pixel! Make yourself into a small square shape.',
          '🤖 Blocky robot! Move only in straight lines and sharp corners.',
          '🪞 Mirror me! Copy your grown-up like a mirror.',
          '✋ Shake out your drawing hand. Wiggle all your fingers!',
          '👀 Eye break! Look at something far away for 10 seconds.',
          '😌 Take a big, slow breath.',

          '**Sticky notes** – make a giant pixel picture on a window or wall!',

      rounds: [
        {
          game: 'pixelstudio', title: 'My game hero', size: 16, minPixels: 30,
          intro: 'Your turn to be the designer! Use everything you learned today.',
          say: 'The studio is yours! Remember: outline, fill, shading, highlight. Save your best work to the gallery!',
          briefTitle: '📋 Design brief: invent a game hero',
          brief: [
            'Draw a **character** for your own game – a hero, a pet or a monster.',
            'Give it a dark **outline**.',
            'Choose a small **palette** – about 4 to 6 colours.',
            'Add a **highlight** or some **shading**.',
            'Bonus: turn on **🪞 Mirror** to make it symmetrical!',
          ],
          done: 'MASTERPIECE! Your hero is saved in your gallery. Download it to print or share!',
        },
      ],
    },

    {
      type: 'quiz', title: 'Boss Battle: The Smudger', short: 'Boss', kind: 'Boss battle', minutes: 6,

        url: 'https://www.youtube.com/watch?v=sjbi7ufjxJE',
        button: 'Watch the bonus video ▶',

      questions: [
        { type: 'mcq', q: 'Pixel is short for…', options: ['picture element', 'pixie elephant', 'pick a pencil'], answer: 0 },
        { type: 'tf', q: 'One pixel can be two colours at the same time.', answer: false, explain: 'Each pixel is just one colour.' },
        { type: 'mcq', q: 'A palette is…', options: ['the set of colours you choose', 'a kind of brush', 'a robot'], answer: 0 },
        { type: 'mcq', q: 'Old video games looked blocky because…', options: ['they could only use a few pixels', 'players liked squares', 'the TVs were broken'], answer: 0 },
        { type: 'mcq', q: 'Pixel artists usually draw on a…', options: ['grid', 'balloon', 'pancake'], answer: 0 },
        { type: 'mcq', q: 'What do pixel artists often draw first?', options: ['the outline', 'the sprinkles', 'the sky'], answer: 0 },
        { type: 'mcq', q: 'To make something look shiny, add…', options: ['a light highlight', 'more black', 'a big X'], answer: 0 },
        { type: 'mcq', q: 'Where does the darker shading colour go?', options: ['on the side in shadow', 'everywhere', 'only on the eyes'], answer: 0 },
        { type: 'tf', q: 'A symmetrical picture is the same on both sides.', answer: true },
        { type: 'mcq', q: 'The 🪞 Mirror tool helps you…', options: ['draw both halves at once', 'make it rain', 'delete everything'], answer: 0 },
