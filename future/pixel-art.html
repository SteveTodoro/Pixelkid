window.LESSON = {

      cards: [
        {
          title: 'Zoom in!', pic: Pixel.svg(HEART.target, HEART.colors),

          ],
          check: { q: "A game character is only 8 squares tall. How will it look?", options: ["blocky", "perfectly smooth", "invisible"], answer: 0 },
        },
        {
          title: 'Pixel art today', pic: '🎮✨',
          text: [
            'Lots of games are still made with pixel art today, because it looks cool and is easy to understand. This whole lesson is pixel art!',
            'Pixel artists draw on a [[grid]] – rows and columns of squares, like squared paper.',
          ],
          check: { type: 'evidence', q: 'Which paper would be best for planning pixel art? Tap the sentence that gives you the clue.', answer: 'like squared paper', hint: 'Find the sentence about the grid.', explain: 'Squared paper is a grid – perfect for pixel art!' },
        },
        {
          title: 'Choosing colours', pic: '🎨',
          text: [
            'Before they start, artists choose a [[palette]] – the set of colours for their picture.',
            'Pro tip: artists often use only a few colours, so everything looks neat and matching.',
          ],
          check: { q: "Which of these is a palette?", options: ["🔴⚫⚪ red, black and white, chosen for a picture", "✏️ a pencil", "🔲 a grid"], answer: 0, hint: "A palette is about colours." },
        },
      ],
    },

      type: 'video', title: 'Coding with QMO: Pixel', short: 'Video', minutes: 4,
      video: { id: 'R65_SYq24Rg', title: 'Coding With QMO – Episode 8 | PIXEL', channel: 'Cozmo & Friends', duration: '2:51' },
      say: 'A short cartoon about pixels! Watch, then answer my questions.',
      clues: [
        'What is pixel short for?',
        'What does a pixel look like?',
        "Why did the portrait look blocky?",
        'How many pixels do computers use?',
      ],
      questions: [
        { type: 'type', q: 'Pixel is short for picture…', answer: ['element', 'picture element'], before: 'picture', placeholder: 'one word', hint: 'It starts with e.' },
        { type: 'mcq', q: 'In the video, a pixel is a…', options: ['small square of colour', 'tiny robot', 'kind of sweet'], answer: 0 },
        { type: 'tf', q: 'One pixel on its own makes a big, detailed picture.', answer: false, explain: 'One pixel is just one square. LOTS of pixels together make a picture.' },
        { type: 'mcq', q: 'Why did the pixel portrait look blocky?', options: ['There were only a few pixels to use', 'The paint was wet', 'The computer was sleepy'], answer: 0 },

      ],
    },

      type: 'game', title: 'Copy the Pixels', short: 'Copy', minutes: 6,
      rounds: [
        Object.assign({
          game: 'pixelcopy', title: 'Pixel heart',
          intro: 'Copy the heart! Pick a colour, then tap or drag on the grid.',
          say: 'Pro trick: draw the black outline first, then use 🪣 Fill to colour the inside in one tap!',
          tips: ['Draw the **black outline** first.', 'Then pick red and use **🪣 Fill** inside the heart.', 'Add one **white** pixel to make it shiny.', 'Made a mistake? Use **↶ Undo** or the **🧽 Eraser**.'],
          done: 'PERFECT HEART! You used an outline and a highlight, just like a pro!',
        }, HEART),
        Object.assign({
          game: 'pixelcopy', title: 'Spooky ghost',
          intro: 'Copy the ghost. See the **grey** pixels? That is **shading** – the shadow side of the ghost.',
          say: 'Shading makes things look round. The grey goes on the shadow side!',
          tips: ['Outline first, then fill with white.', 'Add the **grey shading** on the right side.', 'Use **🔍 Show mistakes** if you get stuck.'],
          done: 'BOO-tiful! That shading makes your ghost look round!',
        }, GHOST),
      ],
    },

    {
      type: 'read', title: 'Design like a pro', short: 'Read 2', minutes: 4,
      say: 'Time to learn the tricks real game artists use!',
      cards: [
        {
          title: 'Big shapes first', pic: '⬛➡️🟥',
          text: [
            'Pixel artists usually start with an [[outline]] – a dark line around the edges of the shape.',
            'Then they fill in the big areas of colour. Details come last.',
          ],
          check: { type: 'build', q: 'You are drawing a pixel cat. Build the order that works best.', answer: ['outline', 'big colours', 'details'], join: ' → ', hint: 'Read the page: what comes first, and what comes last?', explain: 'Outline first, then big colours, details last.' },
        },
        {
          title: 'Light and shadow', pic: Pixel.svg(GHOST.target, GHOST.colors),
          text: [
            '[[Shading|shading]] means using a darker colour on the side in shadow. It makes things look round and solid.',
            'A [[highlight]] is a light pixel where the light shines. It makes things look shiny!',

          check: { type: 'hotspot', q: 'The light is shining on this ghost from the LEFT. Tap the side where the grey shading is.', img: GHOST_PIC, spots: GHOST_SPOTS, answer: 1, hint: 'Shading goes on the side in shadow – away from the light.', explain: 'The shading is on the right – the side away from the light.' },
        },
        {
          title: 'Mirror, mirror', pic: Pixel.svg(ALIEN.target, ALIEN.colors),
          text: [
            'Lots of characters are [[symmetrical]] – the same on both sides, like this alien.',
            'Designers draw one half, then mirror it to make the other half. It saves loads of time!',
          ],
          check: { type: 'oddone', q: 'Three of these are symmetrical. Which one is NOT?', items: ['🦋 a butterfly', '👓 a pair of glasses', '❤️ a heart', '🐌 a snail'], answer: 3, why: 'Why is the snail the odd one out?', reasons: ['Its two sides are not the same', 'It is very slow', 'It lives in a shell'], reason: 0, hint: 'Symmetrical means the same on both sides.' },
        },
        {
          title: 'Fewer colours, better art', pic: '🟩🟦🟨',
          text: [
            'Using too many colours can make a picture messy. Pros pick a small [[palette]] – often just 4 to 6 colours.',
            'A light and a dark version of the same colour is great for shading.',
          ],
          check: { type: 'evidence', q: 'Leo used 20 different colours on a tiny sprite. Tap the sentence that warns what might happen.', answer: 'make a picture messy', hint: 'Find the sentence about too many colours.', explain: 'Too many colours can look messy – pros use 4 to 6.' },
        },
        {
          title: 'Try, check, improve', pic: '↶✏️✅',
          text: [
            'Real designers try an idea, step back to look at it, then fix what is not quite right.',
            'Making mistakes is part of being an artist – that is what Undo is for!',
          ],
          check: { q: "The arm on your robot drawing looks wonky. What would a real designer do?", options: ["Look carefully, then fix it", "Rip it up and give up", "Pretend it is fine"], answer: 0 },
        },
      ],
    },

    {
      type: 'game', title: 'Pixel Arcade: pick a game!', short: 'Arcade', icon: '🕹️', minutes: 4,
      pick: { title: '🕹️ Pick your arcade game!', say: 'Your choice! Which game do you want to play? Win one to carry on – or play them all!' },
      rounds: [
        Object.assign({
          game: 'pixelcopy', title: 'Mirror Alien', emoji: '👾', blurb: 'Draw half an alien – the mirror draws the rest!', mirror: true,

          say: 'Mirror magic! Draw on one side of the purple line and watch the other side copy you.',

          done: 'SYMMETRY MASTER! You drew half and got a whole alien!',

        {
          game: 'invaders', title: 'Pixel Invaders', emoji: '🚀', blurb: 'Shoot the symmetrical letters and the pixel screens.',

          say: 'Tap above an alien to fly there and fire!',
          waves: [
            {
              prompt: 'Shoot the SYMMETRICAL letters!',
              items: [
                { label: 'A', ok: true }, { label: 'H', ok: true }, { label: 'O', ok: true }, { label: 'T', ok: true },
                { label: 'F', ok: false, why: 'F is not the same on both sides.' },
                { label: 'J', ok: false, why: 'J is not the same on both sides.' },
                { label: 'R', ok: false, why: 'R is not the same on both sides.' },
                { label: 'S', ok: false, why: 'S is not the same on both sides.' },
              ],
            },
            {
              prompt: 'Shoot the things made of PIXELS!',
              items: [
                { label: '📺 TV screen', ok: true }, { label: '📱 tablet', ok: true }, { label: '🎮 video game', ok: true }, { label: '💻 laptop', ok: true },
                { label: '🖍️ crayon', ok: false, why: 'Crayon drawings are on paper – no pixels!' },
                { label: '📕 paper book', ok: false, why: 'A paper book is printed – no pixels!' },
                { label: '🧱 brick', ok: false, why: 'A brick has no screen, so no pixels.' },
              ],
            },
          ],
        },
        {
          game: 'steadyhand', title: 'Steady Hand', emoji: '✏️', blurb: 'Guide your pencil along the wiggly path – don\'t touch the sides!',
          intro: 'Press on the green dot and follow the wiggly path all the way to the 🏁 – carefully! Pick Easy, Medium or Hard.',
          say: 'Steady hands! Don\'t touch the sides!',
          done: 'What a steady hand! Perfect for pixel art.',
        },
      ],
    },

    {
      type: 'game', title: 'Pixel Studio', short: 'Studio', icon: '🎨', minutes: 8,
      rounds: [
        {
          game: 'pixelstudio', title: 'My game hero', size: 16, minPixels: 30,
          intro: 'Your turn to be the designer! Use everything you learned today.',
          say: 'The studio is yours! Remember: outline, fill, shading, highlight. Save your best work to the gallery!',
          briefTitle: '📋 Design brief: invent a game hero',
          brief: [
            'Draw a **character** for your own game – a hero, a pet or a monster.',
            'Give it a dark **outline**.',
            'Choose a small **palette** – about 4 to 6 colours.',
            'Add a **highlight** or some **shading**.',
            'Bonus: turn on **🪞 Mirror** to make it symmetrical!',
          ],
          done: 'MASTERPIECE! Your hero is saved in your gallery. Download it to print or share!',
        },
      ],
    },

    {
      type: 'quiz', title: 'Boss Battle: The Smudger', short: 'Boss', kind: 'Boss battle', minutes: 6,
      say: 'Oh no! THE SMUDGER wants to blur every picture in the world! Fight back with your art knowledge, {name}!',
      boss: { name: 'The Smudger', sprite: SMUDGER, attack: '💧', lines: { intro: 'I am THE SMUDGER! I\'ll blur every picture in the world!', hurt: ['Argh! Too sharp!', 'My smudges!', 'Stop making things crisp!'], taunt: ['Smudge!', 'Blurry, blurry!', 'Ha! Wrong!'], angry: 'Now I\'m all smeary with rage!', defeat: 'NOOO! Everything is pixel-perfect!', win: 'Mwahaha! The whole world is blurry now!', stunned: 'Everything\'s gone… all swirly…', beg: ['Wait! I\'ll smudge nicely!', 'Not the crisp edges!', 'Let\'s just blur this whole thing out!'] } },
      bonus: {
        title: '⭐ Bonus quest (for a grown-up to help with)',
        text: 'Want more? Art for Kids Hub has lots more pixel art draw-alongs, like this cheeseburger. Draw along in the Pixel Studio or on squared paper!',
        url: 'https://www.youtube.com/watch?v=sjbi7ufjxJE',
        button: 'Watch the bonus video ▶',
      },
      questions: [
        { type: 'mcq', q: 'Pixel is short for…', options: ['picture element', 'pixie elephant', 'pick a pencil'], answer: 0 },
        { type: 'tf', q: 'One pixel can be two colours at the same time.', answer: false, explain: 'Each pixel is just one colour.' },
        { type: 'type', q: 'The set of colours you choose for a picture is called a…', answer: ['palette', 'pallet', 'palet', 'pallette', 'colour palette'], placeholder: 'one word', hint: 'It starts with p – artists hold one with paint on it!' },
        { type: 'type', q: 'Pixel artists usually draw on rows and columns of squares. What is that called?', answer: ['grid', 'a grid'], placeholder: 'one word', hint: 'It is like squared paper.' },

        { type: 'tf', q: 'A symmetrical picture is the same on both sides.', answer: true },
        { type: 'mcq', q: 'You make a mistake in your pixel art. What is the best thing to do?', options: ['Undo it and try again', 'Throw the tablet', 'Stop drawing forever'], answer: 0 },
        { type: 'order', q: 'Put the pixel art steps in order.', items: ['💡 Plan your idea.', '⬛ Draw the outline.', '🎨 Fill in the big colours.', '✨ Add shading and highlights.'], ends: ['START', 'END'], hint: 'Big shapes first, details last!' },
      ],
    },
  ],
};
