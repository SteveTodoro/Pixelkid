<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design a Poster</title>
  <link rel="stylesheet" href="../shared/lesson.css">

  <script src="../shared/pixel-icons.js"></script>

<body>
<noscript>This lesson needs JavaScript turned on.</noscript>
<script>
// ---------- mini posters for the Design Detective game ----------
const mp = (label, bg, inner) => `<div class="mini-poster" style="background:${bg}"><span class="mp-label">${label}</span>${inner}</div>`;
const tx = (text, color, size, font = 'Lexend', extra = '') =>
  `<div style="color:${color};font-size:${size}cqw;font-family:${font};font-weight:700;text-align:center;${extra}">${text}</div>`;
const at = (x, y, html) => `<div style="position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%)">${html}</div>`;
const em = (e, size) => `<div style="font-size:${size}cqw;line-height:1">${e}</div>`;

const D = {
  contrastBad: mp('A', '#ffffff', tx('PET SHOW', '#ffe66b', 16) + em('🐶', 30) + tx('Saturday 2pm', '#c6f6ef', 9)),
  contrastGood: mp('B', '#fff3a8', tx('PET SHOW', '#1f2a6b', 16) + em('🐶', 30) + tx('Saturday 2pm', '#1f2a6b', 9)),
  bigTitle: mp('A', '#1e6fd9', tx('SPACE<br>PARTY', '#ffffff', 20, '"Pixelify Sans"') + em('🚀', 30) + tx('Friday 6pm', '#ffffff', 8)),
  tinyTitle: mp('B', '#1e6fd9', tx('space party', '#ffffff', 6, '"Pixelify Sans"') + em('🚀', 30) + tx('Friday 6pm · School Hall · Bring a friend · Wear silver', '#ffffff', 8)),
  clutter: mp('A', '#ffffff', at(50, 50, tx('BAKE SALE', '#e53935', 14)) +
    [['🍰', 15, 15], ['🧁', 80, 12], ['🍪', 30, 75], ['🎉', 85, 80], ['⭐', 60, 25], ['🍩', 12, 50], ['🎈', 88, 45], ['🍭', 45, 88], ['🌈', 70, 65], ['🍫', 20, 92], ['☀️', 50, 12], ['🎂', 35, 30]]
      .map(([e, x, y]) => at(x, y, em(e, 16))).join('')),
  clean: mp('B', '#ffffff', tx('BAKE SALE', '#e53935', 16) + em('🧁', 34) + tx('Monday 3pm<br>Class 3', '#1b1b1b', 9)),
  aligned: mp('A', '#2e9e3e', tx('FOOTBALL<br>FUN DAY', '#ffffff', 15, '"Arial Black", Impact') + em('⚽', 28) + tx('Sunday 10am', '#ffffff', 9) + tx('The Park', '#ffffff', 9)),
  messy: mp('B', '#2e9e3e', at(28, 14, tx('FOOTBALL', '#ffffff', 13, '"Arial Black", Impact')) + at(72, 32, tx('FUN DAY', '#ffffff', 13, '"Arial Black", Impact')) +

const HERO = mp('', '#1f2a6b', tx('ROBOT<br>DISCO', '#ffd43b', 18, '"Pixelify Sans"') + em('🤖', 32) + tx('Friday 6pm · School Hall', '#ffffff', 8)).replace('<span class="mp-label"></span>', '');

// the boss: the Clutter Monster, a jumble of every colour at once
const CLUTTER_MONSTER = Pixel.svg([
  '..kk..kkk...',
  '.kyykkrrrk..',
  'kyyyrrrrbbk.',
  'kgggwkrwkbbk',
  'kgggrrrrrbbk',
  'kpppkkkkkbbk',
  'kpppkwkwkook',
  '.kppooooook.',
  '..kkoookkk..',
  '...k.kk.k...',
], { k: '#1b1b1b', y: '#ffd43b', r: '#e53935', b: '#1e6fd9', g: '#7cfc3a', w: '#ffffff', p: '#ff7eb6', o: '#ff8c1a' });

// ---------- the lesson ----------

      nameLabel: 'Designer name:',
    },

    {
      type: 'review', title: 'Last time…', short: 'Recap', minutes: 3,
      from: { title: 'Pixel Art Studio', emoji: '🎨', url: 'pixel-art.html' },

        },
        {
          title: 'Choosing a font', pic: '🔤✨',
          text: [
            'A [[font]] is the style of the letters. Some fonts look fun, some look serious, some look like pixels!',
            'The most important thing is that it is easy to read. Designers usually use just 1 or 2 fonts on a poster.',
          ],
          check: { type: 'evidence', q: 'Your friend wants to use five fancy fonts on their title. Tap the sentence that tells you the most important thing about a font.', answer: 'easy to read', hint: 'What is THE most important thing?', explain: 'Easy to read wins – designers usually use just 1 or 2 fonts.' },
        },
      ],
    },

    {
      type: 'video', title: 'Graphic Design for Kids', short: 'Video', minutes: 9,
      video: { id: '0PEbCwHT7Y4', title: 'Learn with Ms. C — Graphic Design for Kids', channel: 'Design Elementary', duration: '7:42' },
      say: 'Ms. C is a real designer! Watch her first lesson, then come back for my questions.',
      clues: [
        'What things is design made of?',
        'What are some examples of design?',
        'What tools can designers use?',
        'Are there different types of designers?',
      ],
      questions: [
        { type: 'gap', q: 'Ms. C said design is a mix of fonts, shapes, images, colours and ___.', options: ['lines', 'noodles', 'socks'], answer: 0, hint: 'Remember her song: fonts, shapes, colours, …' },
        { type: 'mcq', q: 'Which of these are examples of design?', options: ['logos, posters and websites', 'clouds, rain and thunder', 'rocks, pebbles and sand'], answer: 0 },
        { type: 'mcq', q: 'A designer uses design to…', options: ['share a message or an idea', 'make things much heavier', 'grow plants in the garden'], answer: 0 },
        { type: 'tf', q: 'Designers can create on iPads, laptops or phones.', answer: true },
        { type: 'tf', q: 'There is only one type of designer.', answer: false, explain: 'There are lots – app, website, video, print, motion designers and more!' },
      ],
    },

    {
      type: 'game', title: 'Design Detective', short: 'Detective', minutes: 4,
      rounds: [
        {
          game: 'questions', title: 'Spot the better poster',
          intro: 'Look closely at each pair of posters. Tap the one that does the job better!',
          say: 'Use the 3-second test! Which one would YOU understand in a quick look?',
          questions: [
            { q: 'Which poster is EASIER to read?', optionsHtml: true, options: [D.contrastBad, D.contrastGood], answer: 1, hint: 'Pale yellow on white is very hard to see!', explain: 'Dark writing on a light background has strong contrast.' },
            { q: 'Which title can you read from far away?', optionsHtml: true, options: [D.bigTitle, D.tinyTitle], answer: 0, hint: 'The most important words should be the biggest.', explain: 'A BIG title grabs attention from across the room.' },
            { q: 'Which poster is NOT cluttered?', optionsHtml: true, options: [D.clutter, D.clean], answer: 1, hint: 'Which one is squashed full of stickers?', explain: 'Fewer, bigger things are easier to understand.' },
            { q: 'Which poster is lined up neatly?', optionsHtml: true, options: [D.aligned, D.messy], answer: 0, hint: 'Which one has everything in a neat line down the middle?', explain: 'Lining things up makes a poster look calm and tidy.' },
            { q: 'Which poster tells you WHEN and WHERE?', optionsHtml: true, options: [D.noInfo, D.info], answer: 1, hint: 'Look for a day, a time and a place.', explain: 'Without when and where, nobody knows when to come!' },
          ],
        },
      ],
    },

    {
      type: 'teach', title: 'Teach Mini Bolt: design superpowers', short: 'Teach', minutes: 4,
      say: 'Mini Bolt is making a poster – but his design rules are back to front! Fix his mistakes.',
      robot: { name: 'Mini Bolt', emoji: '🤖' },
      intro: 'Beep boop! I am Mini Bolt. I am going to be the best poster designer EVER. Here are my design rules! (Professor Bolt says my last poster was… hard to read.)',
      lines: [
        { text: 'Make the most important words the smallest, so people read them first.', wrong: 'smallest', fix: 'biggest', options: ['quietest', 'thinnest'], hint: 'Which words does your eye spot first?', why: 'The eye reads the big things first – usually the title. Smaller words, like the time and place, come next.' },
        { text: 'Pale yellow writing on a white poster is easy to read.', wrong: 'easy', fix: 'hard', options: ['fun', 'quick'], hint: 'Do the words stand out from the white?', why: 'Words must stand out from what is behind them – that is contrast. Dark on light, or light on dark, is easy to read.' },
        { text: 'Designers line things up neatly, often all down the middle.', ok: true, why: 'Right! That is called aligning. Things scattered all over the place look messy and are harder to read.' },
        { text: 'Squashing lots of things together makes a poster easier to understand.', wrong: 'easier', fix: 'harder', options: ['quicker', 'prettier'], hint: 'Think of the Clutter Monster.', why: 'Too many things squashed together is clutter. Leave some empty space – fewer, bigger things work better.' },
        { text: 'A palette is a few colours that clash together.', wrong: 'clash', fix: 'work', options: ['fight', 'shout'], hint: 'Should a palette\'s colours fight, or be friends?', why: 'A palette is a few colours that work well together and match the message.' },
      ],
      outro: 'Beep! My design rules are fixed: big titles, strong contrast, line it up, space to breathe and a few colours that work together. My next poster will be AMAZING!',
    },

    {
      type: 'game', title: 'Design Arcade: pick a game!', short: 'Arcade', icon: '🕹️', minutes: 4,
      pick: { title: '🕹️ Pick your arcade game!', say: 'Your choice! Which game do you want to play? Win one to carry on – or play them all!' },
      rounds: [
        {
          game: 'runner', title: 'Design Dash', emoji: '🏃', blurb: 'Race along and grab the good design choices.',
          intro: 'Your hero runs by itself and the words come two at a time – pick the lane with the right one! Collect the **good design** choices and dodge the bad ones.',
          say: 'Tap the top or bottom lane. Collect the GOOD design choices!',
          prompt: 'Collect GOOD design – dodge BAD design!',
          items: [
            { label: 'BIG title', ok: true }, { label: 'dark on light', ok: true },
            { label: 'when & where', ok: true }, { label: 'lined up', ok: true },
            { label: 'tiny title', ok: false, why: 'Titles should be BIG so people can read them from far away!' },
            { label: 'yellow on white', ok: false, why: 'Yellow on white is too hard to read – low contrast!' },
            { label: '15 stickers', ok: false, why: 'Too many stickers is clutter!' },
          ],
        },
        {
          game: 'steadyhand', title: 'Steady Hand', emoji: '✏️', blurb: 'Guide your pencil along the wiggly path – don\'t touch the sides!',
          intro: 'Press on the green dot and follow the wiggly path all the way to the 🏁 – carefully! Pick Easy, Medium or Hard.',
          say: 'Steady hands! Don\'t touch the sides!',
          done: 'What a steady hand! Neat enough for a real designer.',
        },
        {
          game: 'mystery', title: 'Mystery Design Words', emoji: '🔍', blurb: 'Crack the clues to find the design word.',
          intro: 'The Clutter Monster has hidden some **design words**! Read the clue and work out the word. Solve it on the first clue for 3 gems!',
          say: 'The fewer clues you need, the more gems you win!',
          words: [
            { word: 'font', clues: ['Every word you read has one.', 'Some look fun, some look serious, some look like pixels.', 'It is the style of the letters.'] },
            { word: 'contrast', clues: ['Good posters need lots of it.', 'Dark on light has strong… this.', 'It is how much words stand out from what is behind them.'] },
            { word: 'title', clues: ['There is usually just one on a poster.', 'The eye reads it first.', 'It is the biggest words at the top.'], options: ['title', 'clutter', 'palette', 'font'] },
          ],
        },
      ],
    },

    {
      type: 'game', title: 'Poster Studio', short: 'Studio', icon: '🖼️', minutes: 10,
      rounds: [
        {
          game: 'poster', title: 'My event poster',
          intro: 'Your turn! Design a poster for an event you would love to go to.',
          say: 'The studio is yours! Start with a big title, then add when and where. Save your best ones!',
          start: { bg: '#fff3a8', items: [{ t: 'text', text: 'MY EVENT', x: 50, y: 18, size: 12, color: '#1f2a6b', font: 'bold' }] },
          briefTitle: '📋 Design brief: an event poster',
          brief: [
            'Pick an event: a pet show, a birthday party, a game tournament, a movie night… or make one up!',

            { text: 'Easy to read – no ⚠️ warnings', auto: 'contrast' },
