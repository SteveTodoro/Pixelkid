<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelKid</title>
  <link rel="stylesheet" href="shared/lesson.css">
  <script src="shared/pixel.js"></script>
  <script src="shared/pixel-icons.js"></script>
  <script src="shared/avatar.js"></script>
  <style>
    /* header: the hero portrait fills the top-left corner, the title sits beside it */
    .lib-head { position: relative; z-index: 1; display: grid; grid-template-columns: auto auto; justify-content: center; align-items: center; gap: 36px; padding: 16px 16px 4px; }
    .lib-title { text-align: center; }
    .lib-head h1 { font-size: 3.4rem; color: #fff; margin: 0; text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
    .lib-head p { font-family: var(--pixel); font-size: 1.3rem; font-weight: 700; color: #fff; text-shadow: 2px 2px 0 #000; margin: 6px 0 0; }
    /* the hero portrait: a gold frame, on purpose nothing like the grey stone lesson cards */
    .pk-hero { width: 250px; }
    .pk-link { display: block; text-decoration: none; color: inherit; }
    .pk-frame { position: relative; padding: 10px; background: #ffc928; border: 4px solid #000;
      box-shadow: inset 4px 4px 0 #fff1a6, inset -4px -4px 0 #b37800, 0 6px 0 rgba(0,0,0,.3); transition: transform .12s steps(2); }
    .pk-link:hover .pk-frame, .pk-link:focus-visible .pk-frame { transform: translateY(-3px); }
    .pk-pic { position: relative; height: 250px; overflow: hidden; border: 3px solid #000; box-shadow: 0 0 0 3px #b37800; }
    .pk-pic canvas { position: absolute; left: 50%; bottom: 20%; height: 74%; transform: translateX(-50%); image-rendering: pixelated; }
    .rivet { position: absolute; width: 10px; height: 10px; background: #fff1a6; border: 2px solid #000; box-shadow: inset -2px -2px 0 #b37800; transform: rotate(45deg); z-index: 1; }
    .rivet.tl { left: -1px; top: -1px; } .rivet.tr { right: -1px; top: -1px; } .rivet.bl { left: -1px; bottom: -1px; } .rivet.br { right: -1px; bottom: -1px; }
    .me-dress { position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); white-space: nowrap; z-index: 1; padding: 1px 8px; font-family: var(--pixel); font-weight: 700; font-size: .85rem; color: #000; background: var(--gold); border: 2px solid #000; }
    /* the nameplate under the portrait */
    .pk-plate { position: relative; margin: 0 10px; padding: 8px 10px 9px; background: #1f1a12; border: 4px solid #000; border-top: 0; box-shadow: inset 0 0 0 2px #b37800; color: #eee; text-align: left; }
    .me-row { display: flex; align-items: center; gap: 8px; }
    .me-row .xp-bar { flex: 1; min-width: 50px; }
    .pk-plate .xp-level { color: #7cfc3a; font-size: .95rem; white-space: nowrap; }
    .me-meta { display: flex; flex-direction: column; margin-top: 4px; font-weight: 700; font-size: .85rem; color: #ddd; }
    .me-meta b { color: #ffd43b; }
    @media (max-width: 640px) {
      .lib-head { gap: 12px; padding: 12px 12px 2px; }
      .lib-head h1 { font-size: 2rem; }
      .lib-head p { font-size: 1rem; }
      .pk-hero { width: 150px; }
      .pk-frame { padding: 6px; }
      .pk-pic { height: 150px; }
      .pk-plate { margin: 0 6px; padding: 6px 7px; }
      .pk-plate .xp-level { font-size: .75rem; }
      .me-meta { font-size: .72rem; }
      .me-dress { font-size: .7rem; bottom: 3px; }
      .me-row { flex-wrap: wrap; gap: 4px; }
      .me-row .xp-bar { flex-basis: 100%; }
    }
    /* one row of worlds; scrolls sideways on a phone */
    .tabs { position: relative; z-index: 1; display: flex; gap: 8px; max-width: 1040px; margin: 22px auto 0; padding: 4px 16px 8px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs > :first-child { margin-left: auto; }
    .tabs > :last-child { margin-right: auto; }
    .tab { flex: none; cursor: pointer; padding: 8px 14px; font-family: var(--pixel); font-weight: 700; font-size: 1.1rem; color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,.5);
      background: rgba(0,0,0,.35); border: 3px solid #000; }
    .tab:hover { background: rgba(0,0,0,.5); }
    .tab[aria-selected="true"] { background: var(--brand); box-shadow: var(--bevel), 0 4px 0 #000; outline: 3px solid #fff; outline-offset: -1px; }
    .tab.science[aria-selected="true"] { background: #19b3a3; }
    .tab.maths[aria-selected="true"] { background: #e09a00; }
    .tab.english[aria-selected="true"] { background: #d9433b; }
    .tab.future[aria-selected="true"] { background: #7c4dff; }
    .tab.wonders[aria-selected="true"] { background: #1e88e5; }
    .tab.world[aria-selected="true"] { background: #f4511e; }
    .passport { position: relative; z-index: 1; max-width: 1040px; margin: 10px auto 0; padding: 0 16px; }
    .passport-book { padding: 12px 16px; background: #7a1f1f; border: 4px solid #000; box-shadow: var(--bevel), 0 6px 0 rgba(0,0,0,.25); color: #ffd43b; }
    .passport-book h2 { margin: 0 0 8px; font-size: 1.2rem; color: #ffd43b; text-shadow: 2px 2px 0 #000; }
    .stamps { display: flex; flex-wrap: wrap; gap: 10px; }
    .stamp { width: 96px; height: 96px; display: grid; place-items: center; align-content: center; gap: 2px; text-align: center; background: var(--paper); color: #a3300b;
      border: 3px dashed #a3300b; font-family: var(--pixel); font-weight: 700; font-size: .8rem; transform: rotate(var(--tilt, -4deg)); }
    .stamp .sf { font-size: 2.2rem; line-height: 1; }
    .stamp.empty { background: rgba(255,255,255,.15); color: #e8c9c9; border-color: #e8c9c9; transform: none; }
    .stamp.empty .sf { filter: grayscale(1); opacity: .45; }
    .shelf { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding: 16px 16px 90px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
    .lesson-card {
      position: relative; display: flex; flex-direction: column; gap: 4px; padding: 16px; min-height: 150px;
      background: var(--stone); border: 4px solid #000; box-shadow: var(--bevel), 0 6px 0 rgba(0,0,0,.25); color: var(--ink); text-decoration: none;
    }
    a.lesson-card:hover { transform: translateY(-4px); outline: 4px solid #fff; outline-offset: -2px; }
    .lesson-card .le { width: 64px; height: 64px; display: grid; place-items: center; font-size: 2.4rem; background: var(--slot); border: 3px solid #000; box-shadow: var(--bevel-in); }
    .lesson-card h2 { font-size: 1.25rem; margin: 8px 0 0; }
    .lesson-card .unit { color: #444; font-weight: 600; font-size: .85rem; }
    /* corner badge: ▶ new · ⭐ in progress · 🏆 done */
    .lesson-card .badge { position: absolute; top: 12px; right: 12px; padding: 2px 8px; font-family: var(--pixel); font-weight: 700; font-size: .85rem; color: #fff; background: var(--good); border: 2px solid #000; text-shadow: 1px 1px 0 #000; }
    .lesson-card.going .badge { background: #e09a00; }
    .lesson-card.done .badge { background: var(--gold); color: #000; text-shadow: none; }
    .soon { grid-column: 1 / -1; margin-top: 8px; padding: 12px 14px; background: rgba(255,255,255,.55); border: 3px solid #000; }
    .soon h2 { margin: 0 0 10px; font-size: 1.05rem; color: #333; }
    .soon-row { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
    .soon-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-weight: 600; font-size: .8rem; line-height: 1.2; color: #555; }
    .soon-chip .se { width: 44px; height: 44px; display: grid; place-items: center; font-size: 1.6rem; background: var(--slot); border: 2px solid #000; filter: grayscale(.9); opacity: .6; }
  </style>
</head>

const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const records = get('y3:records', {});
const settings = get('y3:settings', {});
let current = 'science';
try { current = localStorage.getItem('y3:tab') || 'science'; } catch (e) { /* ignore */ }
if (!LIBRARY[current]) current = 'science';

const total = Object.values(records).reduce((n, r) => n + (r.stars || 0), 0);
const wal = window.Avatar ? Avatar.wallet() : { balance: total };
// the hero portrait: the avatar breathes, blinks and blinks again when you point at it
if (window.Avatar) {
  document.getElementById('pk-pic').style.background = Avatar.sceneBox(Avatar.load().look.scene);
  const heroAnim = Avatar.animate(document.getElementById('me'), { scale: 10, pet: true });
  document.getElementById('pk-hero').addEventListener('pointerenter', () => heroAnim.blink());
  window.heroAnim = heroAnim;
}
if (settings.name) document.getElementById('hello').textContent = `Welcome back, ${settings.name}! Pick a quest.`;
// the player level carries on across every lesson; new level rewards pop up once
if (window.Avatar) {
  const p = Avatar.levelInfo();
  document.getElementById('level').hidden = false;
  document.getElementById('lvl').textContent = `LV ${p.level} · ${p.title.toUpperCase()}`;
  document.getElementById('lvlfill').style.width = p.into / p.need * 100 + '%';
  document.getElementById('level').title = `${p.toNext} more gems to level ${p.level + 1}`;
  Avatar.newRewards(p.level).forEach((r, k) => setTimeout(() => {
    const t = document.createElement('div'); t.className = 'toast level';
    t.innerHTML = '<div class="toast-icon">🎁</div><div><div class="toast-title">NEW REWARD UNLOCKED!</div><div class="toast-sub"></div></div>';
    t.querySelector('.toast-sub').textContent = `Level ${r.level}: ${r.label}`;
    document.getElementById('toasts').append(t);
    setTimeout(() => t.classList.add('out'), 4200); setTimeout(() => t.remove(), 4700);
  }, 600 + k * 900));
  Avatar.markSeen(p.level);
}

// gems to spend, under the level
const meta = document.getElementById('meta');
meta.innerHTML = '<span>💎 <b></b> to spend</span>';
meta.querySelector('b').textContent = wal.balance;

const tabs = document.getElementById('tabs'), shelf = document.getElementById('shelf');
// Around the World: the passport shows a stamp for every country lesson finished
function passport() {
  const box = document.getElementById('passport');
  box.hidden = current !== 'world';
  if (box.hidden) return;
  const got = get('y3:passport', {});
  const stamps = LIBRARY.world.lessons.filter(l => l.stamp).map((l, k) => {
    const st = got[l.stamp], d = document.createElement('div');
    d.className = 'stamp' + (st ? '' : ' empty');
    d.style.setProperty('--tilt', ((k * 7) % 11 - 5) + 'deg');
    d.innerHTML = '<span class="sf"></span><span class="sn"></span><span class="sd"></span>';
    d.querySelector('.sf').textContent = l.emoji;
    d.querySelector('.sn').textContent = st ? st.name.toUpperCase() : '?';
    d.querySelector('.sd').textContent = st ? st.date : 'not yet';
    return d;
  });
  const n = Object.keys(got).length;
  box.innerHTML = '<div class="passport-book"><h2></h2><div class="stamps"></div></div>';
  box.querySelector('h2').textContent = `🛂 My passport – ${n} countr${n === 1 ? 'y' : 'ies'} visited`;
  box.querySelector('.stamps').replaceChildren(...stamps);
}
function render() {
  document.body.className = current;
  passport();
  tabs.replaceChildren(...Object.entries(LIBRARY).map(([key, s]) => {
    const b = document.createElement('button');
    b.className = 'tab ' + key; b.type = 'button'; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(key === current)); b.textContent = s.tab; b.title = s.label;
    b.onclick = () => { current = key; try { localStorage.setItem('y3:tab', key); } catch (e) { /* ignore */ } render(); };
    return b;
  }));
  const sel = tabs.querySelector('[aria-selected="true"]');
  tabs.scrollLeft = sel.offsetLeft - (tabs.clientWidth - sel.offsetWidth) / 2; // keep the chosen world in view on a phone
  const all = LIBRARY[current].lessons, ready = all.filter(l => l.file), later = all.filter(l => !l.file);
  const cards = ready.map(l => {
    const rec = records[l.id];
    const state = rec && rec.done ? 'done' : rec && rec.stars ? 'going' : 'new';
    const card = document.createElement('a');
    card.className = 'lesson-card ' + state; card.href = l.file;
    card.innerHTML = `<div class="le"></div><h2></h2><div class="unit"></div><span class="badge"></span>`;
    card.querySelector('.le').textContent = l.emoji;
    card.querySelector('h2').textContent = l.title;
    card.querySelector('.unit').textContent = l.unit;
    const badge = card.querySelector('.badge');
    badge.textContent = state === 'done' ? `🏆 ${rec.best}/${rec.total}` : state === 'going' ? `⭐ ${rec.stars} 💎` : '▶ NEW';
    badge.title = state === 'done' ? `Finished! ${rec.stars || 0} gems · boss score ${rec.best}/${rec.total}` : state === 'going' ? 'Keep going!' : 'Not started yet';
    return card;
  });
  // topics still being made: one small strip instead of full-size locked cards
  if (later.length) {
    const soon = document.createElement('section');
    soon.className = 'soon';
    soon.innerHTML = '<h2>🔒 Coming soon</h2><div class="soon-row"></div>';
    soon.querySelector('.soon-row').replaceChildren(...later.map(l => {
      const c = document.createElement('div');
      c.className = 'soon-chip'; c.title = l.unit;
      c.innerHTML = '<span class="se"></span><span class="sn"></span>';
      c.querySelector('.se').textContent = l.emoji;
      c.querySelector('.sn').textContent = l.title;
      return c;
    }));
    cards.push(soon);
  }
  shelf.replaceChildren(...cards);
}
render();
</script>
</body>
</html>
